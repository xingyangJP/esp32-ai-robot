# XcodeGen spec — run `xcodegen generate` in this folder to (re)create RobotBrain.xcodeproj
name: RobotBrain
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
targets:
  RobotBrain:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "README.md"
          - "project.yml"
          - "RobotBrain.xcodeproj"
          - "RobotBrain.entitlements"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseCore
    # Sign in with Apple — REMOTE-mode identity (Firebase). Needs a paid Apple
    # Developer team + the capability enabled for this App ID (Xcode > Signing).
    entitlements:
      path: RobotBrain.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # In-app WiFi provisioning: NEHotspotConfiguration joins the car's setup AP.
        com.apple.developer.networking.HotspotConfiguration: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"           # iPhone
        DEVELOPMENT_TEAM: ""                   # set your personal team in Xcode > Signing
        CODE_SIGN_STYLE: Automatic
        # Identity as BUILD SETTINGS so Xcode's General tab is always populated and
        # survives `xcodegen generate` (no more re-typing Display Name / Version / Build).
        # Bump MARKETING_VERSION (patch) each revision — single source of truth.
        MARKETING_VERSION: "1.1.54"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: RobotBrain
        # Explicit bundle id: the default com.example.RobotBrain was unavailable to
        # register on the Apple Developer team, so use a unique one (Firebase iOS app +
        # Apple provider bundleIds match this). Automatic signing creates the App ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.robotbrainai
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: RobotBrain
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: "Connects to the robot car on your Wi-Fi."
        NSBonjourServices: ["_robotbrain._tcp"]
        # Production remote uses wss:// (TLS). Allow ws:// to LOCAL hosts only so the
        # dev relay (ws://localhost) works in the simulator; does not weaken wss://.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: "Voice commands to the robot."
        NSSpeechRecognitionUsageDescription: "Turns your speech into robot goals."
        CFBundleLocalizations: [en, ja]
